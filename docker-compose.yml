services:
  # Express.js + Prisma ORM + Socket.IO Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exam-system-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      # Never commit a real secret. Both are read from your shell or a .env
      # file next to this compose file; production refuses to boot without
      # them (backend/src/config/env.ts).
      #   JWT_SECRET=$(openssl rand -base64 48)
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET before starting}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:?set ADMIN_INITIAL_PASSWORD before starting}
      - CORS_ORIGIN=http://localhost:5173
      - NODE_ENV=production
      # Optional SMTP configuration for live email alerts
      # - SMTP_HOST=smtp.gmail.com
      # - SMTP_PORT=587
      # - SMTP_USER=your-email@gmail.com
      # - SMTP_PASS=your-app-password
      # - ADMIN_ALERT_EMAIL=admin@harbico.com
    volumes:
      - backend-database:/app/prisma
      - backend-uploads:/app/uploads
    networks:
      - exam-network

  # React + Vite + Nginx Frontend SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exam-system-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - exam-network

volumes:
  backend-database:
    name: exam-system-db-data
  backend-uploads:
    name: exam-system-uploads-data

networks:
  exam-network:
    name: exam-system-network
    driver: bridge
