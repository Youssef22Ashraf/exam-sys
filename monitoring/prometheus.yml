global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # 🔴 Railway Production Deployment
  - job_name: "exam-system-production"
    scheme: https
    metrics_path: "/metrics"
    static_configs:
      - targets: ["mofarreh-exam-system.up.railway.app"]

  # 🟢 Local Development Environment
  - job_name: "exam-system-local"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:5000"]
